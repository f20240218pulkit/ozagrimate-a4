<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="2040" viewBox="0 0 2400 2040">
<rect width="100%" height="100%" fill="white"/>
<text x="40" y="77" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="32" font-weight="700" fill="#183047">OzAgriMate Farm Management - C4 Component Diagram</text>
<text x="40" y="107" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="400" fill="#183047">Components inside the Farm Management container | solid = implemented module, dashed = proposed component</text>
<rect x="120" y="150" width="540" height="170" fill="#e9edf1" stroke="#42647e" stroke-width="2"/>
<text x="390.0" y="188" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="700" fill="#183047">Web App / Mobile App</text>
<text x="390.0" y="214" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#183047">[Container: client applications]</text>
<text x="390.0" y="246" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="400" fill="#183047">Farm owners create and view farms.</text>
<rect x="930" y="150" width="540" height="170" fill="#e9edf1" stroke="#42647e" stroke-width="2"/>
<text x="1200.0" y="188" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="700" fill="#183047">API Gateway</text>
<text x="1200.0" y="214" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#183047">[Container: managed HTTP gateway]</text>
<text x="1200.0" y="246" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="400" fill="#183047">Routes /api/v1 requests; rate-limits</text>
<text x="1200.0" y="272" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="400" fill="#183047">and authenticates callers.</text>
<rect x="1740" y="150" width="540" height="170" fill="#e9edf1" stroke="#42647e" stroke-width="2"/>
<text x="2010.0" y="188" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="700" fill="#183047">Identity and Access</text>
<text x="2010.0" y="214" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#183047">[Container: managed OAuth + grants]</text>
<text x="2010.0" y="246" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="400" fill="#183047">Issues and verifies access tokens.</text>
<rect x="60" y="390" width="2280" height="960" fill="#f7fafc" stroke="#9bb0c0" stroke-width="2"/>
<text x="80" y="425" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="700" fill="#183047">Farm Management [Container: backend service] - services/farm_management/</text>
<rect x="120" y="470" width="540" height="170" fill="#d9ebfa" stroke="#42647e" stroke-width="2"/>
<text x="390.0" y="508" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="700" fill="#183047">HTTP Server</text>
<text x="390.0" y="534" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#183047">[Component: app.py]</text>
<text x="390.0" y="566" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="400" fill="#183047">Hosts local HTTP transport; wires</text>
<text x="390.0" y="592" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="400" fill="#183047">controller, service and repository.</text>
<rect x="930" y="470" width="540" height="170" fill="#d9ebfa" stroke="#42647e" stroke-width="2"/>
<text x="1200.0" y="508" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="700" fill="#183047">Farm REST Controller</text>
<text x="1200.0" y="534" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#183047">[Component: api.py]</text>
<text x="1200.0" y="566" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="400" fill="#183047">Routes POST /farms and GET /farms/{id};</text>
<text x="1200.0" y="592" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="400" fill="#183047">maps errors to the JSON envelope.</text>
<rect x="1740" y="470" width="540" height="170" fill="#d9ebfa" stroke="#42647e" stroke-width="2"/>
<text x="2010.0" y="508" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="700" fill="#183047">Identity Adapter</text>
<text x="2010.0" y="534" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#183047">[Component: security.py]</text>
<text x="2010.0" y="566" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="400" fill="#183047">Resolves the bearer token to a</text>
<text x="2010.0" y="592" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="400" fill="#183047">principal (demo fixtures locally).</text>
<rect x="120" y="780" width="540" height="170" fill="#d9ebfa" stroke="#42647e" stroke-width="2"/>
<text x="390.0" y="818" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="700" fill="#183047">Farm Domain Model / Validator</text>
<text x="390.0" y="844" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#183047">[Component: models.py]</text>
<text x="390.0" y="876" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="400" fill="#183047">Defines farm types; validates name,</text>
<text x="390.0" y="902" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="400" fill="#183047">coordinates and area.</text>
<rect x="930" y="780" width="540" height="170" fill="#d9ebfa" stroke="#42647e" stroke-width="2"/>
<text x="1200.0" y="818" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="700" fill="#183047">Farm Application Service</text>
<text x="1200.0" y="844" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#183047">[Component: service.py]</text>
<text x="1200.0" y="876" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="400" fill="#183047">Applies owner-only creation and</text>
<text x="1200.0" y="902" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="400" fill="#183047">farm-scoped retrieval rules.</text>
<rect x="1740" y="780" width="540" height="170" fill="#d9ebfa" stroke="#42647e" stroke-width="2" stroke-dasharray="14 9"/>
<text x="2010.0" y="818" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="700" fill="#183047">Farm Event Publisher (Outbox)</text>
<text x="2010.0" y="844" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#183047">[Component: proposed - not implemented]</text>
<text x="2010.0" y="876" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="400" fill="#183047">Publishes versioned farm and grant</text>
<text x="2010.0" y="902" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="400" fill="#183047">events after each committed change.</text>
<rect x="930" y="1090" width="540" height="170" fill="#d9ebfa" stroke="#42647e" stroke-width="2"/>
<text x="1200.0" y="1128" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="700" fill="#183047">Farm Repository</text>
<text x="1200.0" y="1154" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#183047">[Component: repository.py]</text>
<text x="1200.0" y="1186" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="400" fill="#183047">Creates farms; looks them up only</text>
<text x="1200.0" y="1212" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="400" fill="#183047">within the caller's owner scope.</text>
<rect x="930" y="1430" width="540" height="170" fill="#e3f0df" stroke="#42647e" stroke-width="2"/>
<text x="1200.0" y="1468" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="700" fill="#183047">Farm Store</text>
<text x="1200.0" y="1494" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#183047">[Container: managed database]</text>
<text x="1200.0" y="1526" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="400" fill="#183047">Farm records and grants; owned</text>
<text x="1200.0" y="1552" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="400" fill="#183047">by Farm Management only.</text>
<rect x="1740" y="1430" width="540" height="170" fill="#e3f0df" stroke="#42647e" stroke-width="2"/>
<text x="2010.0" y="1468" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="700" fill="#183047">Event Broker</text>
<text x="2010.0" y="1494" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#183047">[Container: managed durable messaging]</text>
<text x="2010.0" y="1526" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="400" fill="#183047">Durable, ordered-per-farm delivery</text>
<text x="2010.0" y="1552" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="400" fill="#183047">with replay for recovery.</text>
<rect x="120" y="1430" width="540" height="170" fill="#e9edf1" stroke="#42647e" stroke-width="2"/>
<text x="390.0" y="1468" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="700" fill="#183047">Irrigation and Alerts</text>
<text x="390.0" y="1494" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#183047">[Container: backend service]</text>
<text x="390.0" y="1526" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="400" fill="#183047">Keeps its own read-only farm</text>
<text x="390.0" y="1552" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="400" fill="#183047">access projection (ADR-07).</text>
